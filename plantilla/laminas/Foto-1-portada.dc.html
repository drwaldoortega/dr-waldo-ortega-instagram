<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Foto 1 · Portada con foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2B45}a:hover{color:#26292D}
</style>
</helmet>
<sc-if value="{{overlay}}" hint-placeholder-val="{{ true }}">
<div style="width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #1C2B45; font-family: 'Barlow', Arial, sans-serif">
  <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; background: {{photoBg}}"></div>
  <div style="position: absolute; left: 0; top: 300px; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: {{photoInk}}">
    <svg width="72" height="72" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8h3l2-3h6l2 3h3v11H4z" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px; stroke-linejoin: round"></path>
      <circle cx="12" cy="13" r="3.5" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px"></circle>
    </svg>
    <span style="font-size: 32px; font-weight: 600; letter-spacing: 0.12em">FOTO</span>
    <span style="font-size: 34px; line-height: 1.4; text-align: center; max-width: 700px">{{photoDesc}}</span>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 280px; background: linear-gradient(to bottom, rgba(28, 43, 69, 0.75), rgba(28, 43, 69, 0))"></div>
  <div style="position: absolute; left: 0; bottom: 0; width: 1080px; height: 820px; background: linear-gradient(to top, rgba(28, 43, 69, 0.88) 0%, rgba(28, 43, 69, 0.8) 55%, rgba(28, 43, 69, 0) 100%)"></div>
  <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
      
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 32px; height: 6px; background: {{detail}}"></span>
        <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: #E6E8EB">{{label}}</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 32px">
      <div style="width: 120px; height: 8px; background: {{detail}}"></div>
      <h1 style="margin: 0; white-space: pre-line; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 96px; line-height: 1.05; color: {{head}}">{{pre}}<span style="color: {{hl}}">{{hlText}}</span>{{post}}</h1>
      <p style="margin: 0; font-size: 44px; line-height: 1.45; color: #E6E8EB; max-width: 840px">{{sub}}</p>
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 36px; color: #E6E8EB; margin-top: 24px">
        <span>@dr_waldo_ortega</span>
        <span style="display: flex; align-items: center; gap: 14px; font-weight: 600; color: #F6F4EF">Desliza
          <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" style="fill: none; stroke: {{detail}}; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round"></path>
          </svg>
        </span>
      </div>
    </div>
  </div>
</div>
</sc-if>
<sc-if value="{{split}}" hint-placeholder-val="{{ false }}">
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px; background: #E6E8EB; color: #1C2B45; font-family: 'Barlow', Arial, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 32px">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 32px; height: 6px; background: {{detail}}"></span>
      <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: #26292D">{{label}}</span>
    </div>
  </div>
  <div style="height: 560px; border-radius: 28px; background: {{photoBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: {{photoInk}}">
    <svg width="72" height="72" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8h3l2-3h6l2 3h3v11H4z" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px; stroke-linejoin: round"></path>
      <circle cx="12" cy="13" r="3.5" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px"></circle>
    </svg>
    <span style="font-size: 32px; font-weight: 600; letter-spacing: 0.12em">FOTO</span>
    <span style="font-size: 34px; line-height: 1.4; text-align: center; max-width: 700px">{{photoDesc}}</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 24px">
    <div style="width: 120px; height: 8px; background: {{detail}}"></div>
    <h1 style="margin: 0; white-space: pre-line; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 84px; line-height: 1.05; color: {{head}}">{{pre}}<span style="color: {{hl}}">{{hlText}}</span>{{post}}</h1>
    <p style="margin: 0; font-size: 42px; line-height: 1.45; color: #26292D">{{sub}}</p>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 36px; color: #26292D">
    <span>@dr_waldo_ortega</span>
    <span style="display: flex; align-items: center; gap: 14px; font-weight: 600; color: #1C2B45">Desliza
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6" style="fill: none; stroke: {{detail}}; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round"></path>
      </svg>
    </span>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tematica":{"editor":"enum","options":["Salud masculina","Estilo de vida","Liderazgo"],"default":"Salud masculina"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var D = {
      'Salud masculina': {
        overlay: false, split: true,
        photoBg: 'linear-gradient(160deg, #F6F4EF 0%, #7E6448 100%)', photoInk: '#26292D',
        photoDesc: 'Tú corriendo o entrenando al atardecer · cuerpo completo · luz cálida',
        detail: '#BA6A32', head: '#1C2B45', hl: '#BA6A32',
        pre: 'Sostienes todo.\n¿Quién te sostiene ', hlText: 'a ti', post: '?',
        sub: 'Lo que nadie te dijo sobre cuidarte.'
      },
      'Estilo de vida': {
        overlay: false, split: true,
        photoBg: 'linear-gradient(160deg, #F6F4EF 0%, #5A6B3F 100%)', photoInk: '#26292D',
        photoDesc: 'Caminata en cerro o costa · cuerpo completo · luz de mañana',
        detail: '#5A6B3F', head: '#1C2B45', hl: '#5A6B3F',
        pre: 'Tu cuerpo no es tu empleado ', hlText: 'incansable', post: '.',
        sub: 'Por qué descansar también es parte de rendir.'
      },
      'Liderazgo': {
        overlay: true, split: false,
        photoBg: 'linear-gradient(160deg, #8A949C 0%, #1C2B45 100%)', photoInk: '#F6F4EF',
        photoDesc: 'Tú hablando en un foro · medio cuerpo · luz fría',
        detail: '#8A949C', head: '#8A949C', hl: '#F6F4EF',
        pre: 'Para liderar a otros, ', hlText: 'lidérate a ti', post: '.',
        sub: 'Tu equipo siente tu cansancio antes que tú.'
      }
    };
    var tem = this.props.tematica ?? 'Salud masculina';
    var d = D[tem] || D['Salud masculina'];
    return Object.assign({ label: tem }, d);
  }
}
</script>
</body>
</html>
