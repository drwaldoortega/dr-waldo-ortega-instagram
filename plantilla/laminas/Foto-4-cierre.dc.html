<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Foto 4 · Cierre con retrato</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2B45}a:hover{color:#26292D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: {{bg}}; color: {{title}}; font-family: 'Barlow', Arial, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 32px; height: 6px; background: {{detail}}"></span>
      <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: {{muted}}">{{label}}</span>
    </div>
    <span style="font-size: 32px; font-weight: 600; color: {{muted}}">06 / 06</span>
  </div>
  <div style="height: 460px; border-radius: 28px; background: {{photoBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: {{photoInk}}">
    <svg width="72" height="72" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8h3l2-3h6l2 3h3v11H4z" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px; stroke-linejoin: round"></path>
      <circle cx="12" cy="13" r="3.5" style="fill: none; stroke: {{photoInk}}; stroke-width: 1.4px"></circle>
    </svg>
    <span style="font-size: 32px; font-weight: 600; letter-spacing: 0.12em">FOTO</span>
    <span style="font-size: 34px; line-height: 1.4; text-align: center; max-width: 700px">{{photoDesc}}</span>
  </div>
  <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 80px; line-height: 1.05; color: {{head}}">{{pre}}<span style="color: {{hl}}">{{hlText}}</span>{{post}}</h2>
  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="height: 2px; background: {{detail}}"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 40px; font-weight: 600; color: {{title}}">Dr. Waldo Ortega · <span style="font-weight: 400; color: {{muted}}">@dr_waldo_ortega</span></span>
      <span style="font-size: 36px; line-height: 1.45; color: {{muted}}">Médico familiar · Estilos de vida y salud masculina</span>
    </div>
    <p style="margin: 0; font-size: 36px; line-height: 1.45; color: {{muted}}">Lidérate a ti. Cuida lo que heredas. Transforma lo que tocas.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tematica":{"editor":"enum","options":["Salud masculina","Estilo de vida","Liderazgo"],"default":"Salud masculina"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var D = {
      'Salud masculina': {
        bg: '#E6E8EB', title: '#1C2B45', muted: '#26292D', head: '#1C2B45', hl: '#BA6A32', detail: '#BA6A32',
        photoBg: 'linear-gradient(160deg, #F6F4EF 0%, #7E6448 100%)', photoInk: '#26292D',
        photoDesc: 'Retrato tuyo · medio cuerpo · mirada directa · luz cálida',
        pre: 'Envíaselo al hombre que lo ', hlText: 'sostiene todo', post: '.'
      },
      'Estilo de vida': {
        bg: '#E6E8EB', title: '#1C2B45', muted: '#26292D', head: '#1C2B45', hl: '#5A6B3F', detail: '#5A6B3F',
        photoBg: 'linear-gradient(160deg, #F6F4EF 0%, #5A6B3F 100%)', photoInk: '#26292D',
        photoDesc: 'Retrato tuyo al aire libre · mirada directa · luz de mañana',
        pre: 'Guárdalo para tu próxima ', hlText: 'semana pesada', post: '.'
      },
      'Liderazgo': {
        bg: '#1C2B45', title: '#F6F4EF', muted: '#E6E8EB', head: '#8A949C', hl: '#F6F4EF', detail: '#8A949C',
        photoBg: 'linear-gradient(160deg, #8A949C 0%, #26292D 100%)', photoInk: '#F6F4EF',
        photoDesc: 'Retrato formal · ciudad de fondo · mirada directa · luz fría',
        pre: 'Envíaselo a quien ', hlText: 'lidera contigo', post: '.'
      }
    };
    var tem = this.props.tematica ?? 'Salud masculina';
    var d = D[tem] || D['Salud masculina'];
    return Object.assign({ label: tem }, d);
  }
}
</script>
</body>
</html>
