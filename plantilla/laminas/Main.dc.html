<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada · Salud masculina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2B45}a:hover{color:#26292D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: {{bg}}; color: {{title}}; font-family: 'Barlow', Arial, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 32px; height: 6px; background: {{detail}}"></span>
      <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: {{muted}}">{{label}}</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 36px">
    <div style="width: 120px; height: 8px; background: {{detail}}"></div>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 96px; line-height: 1.05; color: {{head}}">Sostienes todo.</h1>
      <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 96px; line-height: 1.05; color: {{head}}">¿Quién te sostiene <span style="color: {{hl}}">a&nbsp;ti</span>?</h2>
    </div>
    <p style="margin: 0; font-size: 44px; line-height: 1.45; color: {{muted}}; max-width: 820px">Lo que nadie te dijo sobre cuidarte.</p>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 36px; color: {{muted}}">
    <span>@dr_waldo_ortega</span>
    <span style="display: flex; align-items: center; gap: 14px; font-weight: 600; color: {{title}}">Desliza
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6" style="fill: none; stroke: {{detail}}; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round"></path>
      </svg>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tematica":{"editor":"enum","options":["Salud masculina","Estilo de vida","Liderazgo"],"default":"Salud masculina"},"fondo":{"editor":"enum","options":["Gris plata","Blanco cálido","Azul marino"],"default":"Gris plata"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      'Salud masculina': { c: '#BA6A32', k: 'naranja' },
      'Estilo de vida': { c: '#5A6B3F', k: 'oliva' },
      'Liderazgo': { c: '#7E6448', k: 'tierra' }
    };
    var tem = this.props.tematica ?? 'Salud masculina';
    var t = T[tem] || T['Salud masculina'];
    var f = this.props.fondo ?? 'Gris plata';
    if (t.k === 'oliva' && f === 'Azul marino') f = 'Gris plata';
    if (t.k === 'tierra') f = 'Azul marino';
    var azul = f === 'Azul marino';
    var blanco = f === 'Blanco cálido';
    var lidAzul = azul && t.k === 'tierra';
    return {
      label: tem,
      detail: lidAzul ? '#8A949C' : t.c,
      bg: azul ? '#1C2B45' : (blanco ? '#F6F4EF' : '#E6E8EB'),
      title: azul ? '#F6F4EF' : '#1C2B45',
      head: lidAzul ? '#8A949C' : (azul ? '#F6F4EF' : '#1C2B45'),
      muted: azul ? '#E6E8EB' : '#26292D',
      hl: (azul && t.k !== 'naranja') ? '#F6F4EF' : t.c
    };
  }
}
</script>
</body>
</html>
