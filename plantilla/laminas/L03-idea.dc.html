<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lámina 03 · Una idea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2B45}a:hover{color:#26292D}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px; background: {{bg}}; color: #1C2B45; font-family: 'Barlow', Arial, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 36px">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 32px; height: 6px; background: {{detail}}"></span>
      <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: #26292D">{{label}}</span>
    </div>
    <span style="font-size: 32px; font-weight: 600; color: #26292D">03 / 06</span>
  </div>
  <div style="background: {{cardBg}}; border-radius: 28px; padding: 56px; display: flex; flex-direction: column; gap: 28px">
    <span style="font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 120px; line-height: 0.85; color: {{detail}}">01</span>
    <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; font-size: 84px; line-height: 1.05; color: #1C2B45">Tu cuerpo avisa antes.</h2>
    <p style="margin: 0; font-size: 40px; line-height: 1.45; color: #26292D">El cansancio que no se va, el sueño que no repara, el deseo que baja. No son «cosas de la edad»: son señales.</p>
    <div style="height: 4px; background: {{detail}}; width: 64px"></div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 32px; font-weight: 600; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase; color: #26292D">Ejemplo</span>
      <p style="margin: 0; font-size: 40px; line-height: 1.45; color: #26292D">Si llevas meses diciendo «ya se me va a pasar», esa frase también es una señal.</p>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 36px; color: #26292D">
    <span style="font-weight: 600; color: #1C2B45">Dr. Waldo Ortega</span>
    <span>@dr_waldo_ortega</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tematica":{"editor":"enum","options":["Salud masculina","Estilo de vida","Liderazgo"],"default":"Salud masculina"},"fondo":{"editor":"enum","options":["Gris plata","Blanco cálido"],"default":"Gris plata"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var T = { 'Salud masculina': '#BA6A32', 'Estilo de vida': '#5A6B3F', 'Liderazgo': '#7E6448' };
    var tem = this.props.tematica ?? 'Salud masculina';
    var blanco = (this.props.fondo ?? 'Gris plata') === 'Blanco cálido';
    return {
      label: tem,
      detail: T[tem] || T['Salud masculina'],
      bg: blanco ? '#F6F4EF' : '#E6E8EB',
      cardBg: blanco ? 'transparent' : '#F6F4EF'
    };
  }
}
</script>
</body>
</html>
